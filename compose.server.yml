services:
  vote:
    image: ts-academy-capstone/vote:local
    build:
      target: final
    volumes: !reset []
    ports: !override
      - "127.0.0.1:8080:8080"

  result:
    image: ts-academy-capstone/result:local
    build:
      target: final
    volumes: !reset []
    ports: !override
      - "127.0.0.1:8081:8080"
