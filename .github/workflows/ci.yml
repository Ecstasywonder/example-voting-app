name: Capstone CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: capstone-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  end-to-end:
    name: Compose end-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: result
    env:
      COMPOSE_PROJECT_NAME: capstone-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the Compose integration suite
        run: >-
          docker compose --project-name "$COMPOSE_PROJECT_NAME"
          --file docker-compose.test.yml up --build --abort-on-container-exit
          --exit-code-from sut

      - name: Collect Compose logs
        if: failure()
        run: >-
          docker compose --project-name "$COMPOSE_PROJECT_NAME"
          --file docker-compose.test.yml logs --no-color
          > "$RUNNER_TEMP/compose-test.log"

      - name: Upload failed Compose logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compose-test-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/compose-test.log
          if-no-files-found: error
          retention-days: 7

      - name: Remove test containers and volumes
        if: always()
        run: >-
          docker compose --project-name "$COMPOSE_PROJECT_NAME"
          --file docker-compose.test.yml down --volumes --remove-orphans

  build-and-scan:
    name: Build and scan ${{ matrix.name }}
    needs: end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vote
            context: vote
            dockerfile: vote/Dockerfile
          - name: result
            context: result
            dockerfile: result/Dockerfile
          - name: worker
            context: worker
            dockerfile: worker/Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Derive the GHCR repository name
        id: image
        env:
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          image_owner="${GITHUB_REPOSITORY_OWNER,,}"
          printf 'repository=ghcr.io/%s/example-voting-app-%s\n' "$image_owner" "$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Build the linux/amd64 application image
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_TAG: ${{ github.sha }}
          BUILD_CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          OCI_SOURCE: https://github.com/${{ github.repository }}
        run: >-
          docker build --platform linux/amd64 --file "$DOCKERFILE"
          --label "org.opencontainers.image.source=$OCI_SOURCE"
          --tag "$IMAGE_REPOSITORY:$IMAGE_TAG" "$BUILD_CONTEXT"

      - name: Prepare the Trivy report directory
        run: mkdir -p trivy-reports

      - name: Scan for HIGH and CRITICAL vulnerabilities
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.repository }}:${{ github.sha }}
          format: json
          output: ${{ runner.temp }}/trivy-${{ matrix.name }}.json
          severity: HIGH,CRITICAL
          vuln-type: os,library
          scanners: vuln,secret
          version: v0.76.0
          exit-code: '1'

      - name: Create and print a sanitized Trivy report
        if: always()
        env:
          TRIVY_RAW_REPORT: ${{ runner.temp }}/trivy-${{ matrix.name }}.json
          TRIVY_SANITIZED_REPORT: trivy-reports/${{ matrix.name }}.json
          EXPECTED_IMAGE: ${{ steps.image.outputs.repository }}:${{ github.sha }}
        run: |
          set -eu
          if [ ! -f "$TRIVY_RAW_REPORT" ]; then
            printf 'Trivy did not produce the expected JSON report: %s\n' "$TRIVY_RAW_REPORT" >&2
            exit 1
          fi
          jq -e --arg image "$EXPECTED_IMAGE" '
            .SchemaVersion == 2 and .ArtifactName == $image and
            (.Results | type == "array")
          ' "$TRIVY_RAW_REPORT" >/dev/null
          jq '{
            SchemaVersion,
            ArtifactName,
            ArtifactType,
            Results: [
              .Results[]? | {
                Target,
                Class,
                Type,
                Vulnerabilities: [
                  .Vulnerabilities[]? | {
                    VulnerabilityID,
                    PkgName,
                    InstalledVersion,
                    FixedVersion,
                    Severity
                  }
                ],
                Secrets: [
                  .Secrets[]? | {
                    RuleID,
                    Category,
                    Severity,
                    Title,
                    StartLine,
                    EndLine
                  }
                ]
              }
            ]
          }' "$TRIVY_RAW_REPORT" > "$TRIVY_SANITIZED_REPORT"
          jq -e . "$TRIVY_SANITIZED_REPORT" >/dev/null
          jq -c '
            .Results[]? as $result |
            (($result.Vulnerabilities // [])[]? | {
              kind: "vulnerability",
              target: $result.Target,
              severity: .Severity,
              id: .VulnerabilityID,
              package: .PkgName,
              installedVersion: .InstalledVersion,
              fixedVersion: .FixedVersion
            }),
            (($result.Secrets // [])[]? | {
              kind: "secret",
              target: $result.Target,
              ruleID: .RuleID,
              startLine: .StartLine,
              endLine: .EndLine
            })
          ' "$TRIVY_SANITIZED_REPORT"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ matrix.name }}-${{ github.run_id }}
          path: trivy-reports/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce the vulnerability gate
        if: steps.trivy.outcome == 'failure'
        run: exit 1

      - name: Export the scanned image for publishing
        if: github.event_name == 'push'
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: >-
          docker save "$IMAGE_REPOSITORY:$IMAGE_TAG"
          | gzip --no-name > "$RUNNER_TEMP/image.tar.gz"

      - name: Upload the scanned image
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scanned-image-${{ matrix.name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/image.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.name }}
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'Ecstasywonder/example-voting-app'
    needs: build-and-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [vote, result, worker]
    steps:
      - name: Derive the GHCR repository name
        id: image
        env:
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          image_owner="${GITHUB_REPOSITORY_OWNER,,}"
          printf 'repository=ghcr.io/%s/example-voting-app-%s\n' "$image_owner" "$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Download the scanned image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scanned-image-${{ matrix.name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/scanned-image

      - name: Load the scanned image
        run: gzip --decompress --stdout "$RUNNER_TEMP/scanned-image/image.tar.gz" | docker load

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push the scanned commit image
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: docker push "$IMAGE_REPOSITORY:$IMAGE_TAG"

      - name: Record the immutable published image digest
        env:
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_TAG: ${{ github.sha }}
          DIGEST_MANIFEST: ${{ runner.temp }}/${{ matrix.name }}.json
        run: |
          set -euo pipefail
          repo_digests="$(docker image inspect "$IMAGE_REPOSITORY:$IMAGE_TAG" --format '{{json .RepoDigests}}')"
          digest="$(jq -er --arg repository "$IMAGE_REPOSITORY" '
            [ .[] | select(startswith($repository + "@sha256:")) | select(test("@sha256:[0-9a-f]{64}$")) ]
            | if length == 1 then .[0] else error("expected exactly one digest for the published repository") end
          ' <<<"$repo_digests")"
          jq -en \
            --arg name "$IMAGE_NAME" \
            --arg repository "$IMAGE_REPOSITORY" \
            --arg commit "$IMAGE_TAG" \
            --arg digest "$digest" \
            '{name: $name, repository: $repository, commit: $commit, digest: $digest}' \
            > "$DIGEST_MANIFEST"
          jq -e '
            keys == ["commit", "digest", "name", "repository"] and
            (.name | type == "string") and
            (.repository | type == "string") and
            (.commit | test("^[0-9a-f]{40}$")) and
            (.digest | test("^.+@sha256:[0-9a-f]{64}$"))
          ' "$DIGEST_MANIFEST" >/dev/null

      - name: Upload the published image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-digest-${{ matrix.name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy immutable images to the k3s cluster
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'Ecstasywonder/example-voting-app'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      id-token: write
    env:
      AWS_REGION: us-east-1
      SSM_DOCUMENT_NAME: TSAcademyCapstoneDeployVoting
      SSM_AGENT_MIN_VERSION: 3.3.2746.0
    steps:
      - name: Download published image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: published-digest-*-${{ github.run_id }}
          path: ${{ runner.temp }}/published-digests
          merge-multiple: true

      - name: Validate the deployment inputs
        id: digests
        env:
          DIGEST_DIRECTORY: ${{ runner.temp }}/published-digests
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_REPOSITORY_PREFIX: ghcr.io/ecstasywonder/example-voting-app-
        run: |
          set -euo pipefail
          expected_files=$'result.json\nvote.json\nworker.json'
          actual_files="$(find "$DIGEST_DIRECTORY" -type f -printf '%f\n' | LC_ALL=C sort)"
          test "$actual_files" = "$expected_files"

          jq -es \
            --arg commit "$EXPECTED_COMMIT" \
            --arg prefix "$EXPECTED_REPOSITORY_PREFIX" '
              def valid_record:
                type == "object" and
                keys == ["commit", "digest", "name", "repository"] and
                (.name | type == "string" and IN("vote", "result", "worker")) and
                (. as $record | .repository | type == "string" and . == ($prefix + $record.name)) and
                (.commit | type == "string" and . == $commit) and
                (. as $record | .digest | type == "string" and (capture("^(?<repository>.+)@sha256:[0-9a-f]{64}$").repository == $record.repository))
              ;
              length == 3 and
              all(.[]; valid_record) and
              ([.[].name] | sort == ["result", "vote", "worker"])
            ' \
            "$DIGEST_DIRECTORY/vote.json" \
            "$DIGEST_DIRECTORY/result.json" \
            "$DIGEST_DIRECTORY/worker.json" >/dev/null

          # The manifests retain repository@sha256 for provenance. The fixed
          # SSM document accepts the digest component only, after the schema
          # validation above has bound it to the expected repository.
          printf 'vote_digest=%s\n' "$(jq -er '.digest | split("@")[1]' "$DIGEST_DIRECTORY/vote.json")" >> "$GITHUB_OUTPUT"
          printf 'result_digest=%s\n' "$(jq -er '.digest | split("@")[1]' "$DIGEST_DIRECTORY/result.json")" >> "$GITHUB_OUTPUT"
          printf 'worker_digest=%s\n' "$(jq -er '.digest | split("@")[1]' "$DIGEST_DIRECTORY/worker.json")" >> "$GITHUB_OUTPUT"

      - name: Configure deployment credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::896986966867:role/TSAcademyCapstoneGitHubDeploy
          aws-region: us-east-1
          role-session-name: GHA-${{ github.run_id }}
          role-duration-seconds: 900
          allowed-account-ids: 896986966867

      - name: Locate the online deployment instance
        id: instance
        env:
          INSTANCE_INFORMATION: ${{ runner.temp }}/instance-information.json
        run: |
          set -euo pipefail
          aws ssm describe-instance-information \
            --filters 'Key=tag:Name,Values=ts-academy-k3s' 'Key=tag:Project,Values=TS Academy DevOps Capstone' \
            --query 'InstanceInformationList[].{id:InstanceId,ping:PingStatus,agent:AgentVersion}' \
            --output json > "$INSTANCE_INFORMATION"
          jq -e --arg minimum_version "$SSM_AGENT_MIN_VERSION" '
            def version: split(".") | map(tonumber);
            length == 1 and
            (.[0].id | type == "string" and test("^i-[0-9a-f]{8,17}$")) and
            (.[0].ping == "Online") and
            (.[0].agent | type == "string" and test("^[0-9]+(\\.[0-9]+){3}$") and (version >= ($minimum_version | version)))
          ' "$INSTANCE_INFORMATION" >/dev/null
          printf 'id=%s\n' "$(jq -er '.[0].id' "$INSTANCE_INFORMATION")" >> "$GITHUB_OUTPUT"

      - name: Send the deployment command
        id: command
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          PARAMETERS_FILE: ${{ runner.temp }}/ssm-parameters.json
          COMMAND_RESPONSE: ${{ runner.temp }}/ssm-send-command.json
          VOTE_DIGEST: ${{ steps.digests.outputs.vote_digest }}
          RESULT_DIGEST: ${{ steps.digests.outputs.result_digest }}
          WORKER_DIGEST: ${{ steps.digests.outputs.worker_digest }}
        run: |
          set -euo pipefail
          jq -en \
            --arg commit_sha "$GITHUB_SHA" \
            --arg vote_digest "$VOTE_DIGEST" \
            --arg result_digest "$RESULT_DIGEST" \
            --arg worker_digest "$WORKER_DIGEST" \
            '{commitSha: [$commit_sha], voteDigest: [$vote_digest], resultDigest: [$result_digest], workerDigest: [$worker_digest]}' \
            > "$PARAMETERS_FILE"
          aws ssm send-command \
            --document-name "$SSM_DOCUMENT_NAME" \
            --document-version '$DEFAULT' \
            --instance-ids "$INSTANCE_ID" \
            --parameters "file://$PARAMETERS_FILE" \
            --timeout-seconds 600 \
            --query '{commandId:Command.CommandId}' \
            --output json > "$COMMAND_RESPONSE"
          command_id="$(jq -er '.commandId | select(type == "string" and test("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"))' "$COMMAND_RESPONSE")"
          printf 'id=%s\n' "$command_id" >> "$GITHUB_OUTPUT"
          {
            printf '### SSM deployment command\n\n'
            printf '%s\n' "- Command ID: \`$command_id\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for the deployment command
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          COMMAND_ID: ${{ steps.command.outputs.id }}
          INVOCATION_RESPONSE: ${{ runner.temp }}/ssm-command-invocation.json
          INVOCATION_ERROR: ${{ runner.temp }}/ssm-command-invocation-error.log
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 720))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if ! aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json > "$INVOCATION_RESPONSE" 2> "$INVOCATION_ERROR"; then
              if grep -Fq 'InvocationDoesNotExist' "$INVOCATION_ERROR"; then
                sleep 10
                continue
              fi
              cat "$INVOCATION_ERROR" >&2
              exit 1
            fi

            status="$(jq -er '.Status | select(type == "string")' "$INVOCATION_RESPONSE")"
            case "$status" in
              Pending|InProgress|Delayed|Cancelling)
                sleep 10
                ;;
              Success)
                jq -r '.StandardOutputContent // ""' "$INVOCATION_RESPONSE"
                jq -r '.StandardErrorContent // ""' "$INVOCATION_RESPONSE" >&2
                jq -e '.ResponseCode == 0' "$INVOCATION_RESPONSE" >/dev/null
                exit 0
                ;;
              Failed|TimedOut|Cancelled)
                jq -r '.StandardOutputContent // ""' "$INVOCATION_RESPONSE"
                jq -r '.StandardErrorContent // ""' "$INVOCATION_RESPONSE" >&2
                exit 1
                ;;
              *)
                printf 'Unexpected SSM command status: %s\n' "$status" >&2
                exit 1
                ;;
            esac
          done
          printf 'Timed out waiting for SSM command %s\n' "$COMMAND_ID" >&2
          exit 1
