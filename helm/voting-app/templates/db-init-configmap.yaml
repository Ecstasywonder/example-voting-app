apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init
  labels:
    {{- include "voting-app.labels" . | nindent 4 }}
data:
  10-create-voting-app.sh: |
    #!/bin/sh
    set -eu
    : "${APP_DB_PASSWORD:?app database password required}"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<'SQL'
    \getenv app_password APP_DB_PASSWORD
    CREATE ROLE voting_app LOGIN PASSWORD :'app_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
    GRANT CONNECT ON DATABASE postgres TO voting_app;
    GRANT USAGE, CREATE ON SCHEMA public TO voting_app;
    SQL
