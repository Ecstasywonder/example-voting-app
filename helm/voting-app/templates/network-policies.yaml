# Ingress is denied by default for this release. Egress stays open for DNS and
# image/application runtime needs; the app does not require Internet ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    {{- include "voting-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "voting-app.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
---
{{- range $component := list "vote" "result" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-namespace-to-{{ $component }}
  labels:
    {{- include "voting-app.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "voting-app.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports: [{ protocol: TCP, port: 8080 }]
---
{{- end }}
{{- range $target := list "redis" "db" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apps-to-{{ $target }}
  labels:
    {{- include "voting-app.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "voting-app.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $target }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- if eq $target "redis" }}
        - podSelector:
            matchLabels:
              {{- include "voting-app.selectorLabels" $ | nindent 14 }}
              app.kubernetes.io/component: vote
        - podSelector:
            matchLabels:
              {{- include "voting-app.selectorLabels" $ | nindent 14 }}
              app.kubernetes.io/component: worker
        {{- else }}
        - podSelector:
            matchLabels:
              {{- include "voting-app.selectorLabels" $ | nindent 14 }}
              app.kubernetes.io/component: result
        - podSelector:
            matchLabels:
              {{- include "voting-app.selectorLabels" $ | nindent 14 }}
              app.kubernetes.io/component: worker
        {{- end }}
      ports: [{ protocol: TCP, port: {{ ternary 6379 5432 (eq $target "redis") }} }]
---
{{- end }}
