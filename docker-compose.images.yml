# for running in docker compose with prebuilt images

# version is now using "compose spec"
# v2 and v3 are now combined!
# docker-compose v1.27+ required

services:
  vote:
    image: ${VOTE_IMAGE:-ts-academy-capstone/vote:local}
    depends_on:
      redis:
        condition: service_healthy 
    ports:
      - "8080:8080"
    networks:
      - front-tier
      - back-tier

  result:
    image: ${RESULT_IMAGE:-ts-academy-capstone/result:local}
    depends_on:
      db:
        condition: service_healthy 
    ports:
      - "8081:8080"
    networks:
      - front-tier
      - back-tier

  worker:
    image: ${WORKER_IMAGE:-ts-academy-capstone/worker:local}
    depends_on:
      redis:
        condition: service_healthy 
      db:
        condition: service_healthy 
    networks:
      - back-tier

  redis:
    image: redis:7.4.11-alpine3.21@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    volumes:
      - "./healthchecks:/healthchecks"
    healthcheck:
      test: /healthchecks/redis.sh
      interval: "5s"
    networks:
      - back-tier

  db:
    # Keep PostgreSQL 15 to preserve the existing database volume format.
    image: postgres:15.16-alpine3.23@sha256:5fe8ca7fc662071188c30271cb870d1ce9a6ec4578c934b064697ae77a9241e1
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    volumes:
      - "db-data:/var/lib/postgresql/data"
      - "./healthchecks:/healthchecks"
    healthcheck:
      test: /healthchecks/postgres.sh
      interval: "5s"
    networks:
      - back-tier

volumes:
  db-data:

networks:
  front-tier:
  back-tier:
